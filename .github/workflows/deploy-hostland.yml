
name: Deploy TODM to Hostland

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: todm-hostland-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTLAND_SSH_PRIVATE_KEY }}
          HOSTLAND_KNOWN_HOSTS: ${{ secrets.HOSTLAND_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$HOSTLAND_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy public website
        run: |
          rsync -avz \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/supabase/' \
            --exclude='/tests/' \
            --exclude='/docs/' \
            --exclude='/.gitignore' \
            --exclude='/.gitattributes' \
            --exclude='/.DS_Store' \
            --exclude='/.env*' \
            --exclude='*.sql' \
            --exclude='*.md' \
            -e "ssh -i ~/.ssh/id_ed25519 -p 1024 -o BatchMode=yes -o Ciphers=aes256-gcm@openssh.com -o StrictHostKeyChecking=yes" \
            ./ host1891168@ftp11.hostland.ru:/home/host1891168/host1891168.hostland.pro/htdocs/www/
