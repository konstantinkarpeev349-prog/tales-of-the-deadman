<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Управление TODM</title>
  <link rel="stylesheet" href="account.css">
  <link rel="stylesheet" href="admin-hub.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
  <script src="supabase-config.js" defer></script>
  <script src="auth-client.js?v=4" defer></script>
  <script src="warning-templates.js?v=1" defer></script>
  <script src="account-shop-prices.js?v=2" defer></script>
  <script src="admin-hub.js?v=1" defer></script>
</head>
<body class="account-page admin-hub-page">
  <div class="hub-gate" data-gate role="status" aria-live="polite">Проверяем полномочия TODM…</div>
  <div class="hub-shell" data-hub hidden>
    <header class="hub-header">
      <a class="hub-back" href="Account.html">← Личный кабинет</a>
      <div><p class="eyebrow">Защищённый контур</p><h1>Управление TODM</h1></div>
      <span class="hub-role" data-role></span>
    </header>
    <nav class="hub-nav" aria-label="Разделы управления">
      <button type="button" data-section="overview">Обзор</button>
      <button type="button" data-section="users">Пользователи</button>
      <button type="button" data-section="tickets">Обращения</button>
      <button type="button" data-section="system">Система</button>
    </nav>
    <main class="hub-main" data-workspace tabindex="-1"></main>
  </div>
  <div class="hub-context-wrap" data-context-wrap hidden>
    <div class="hub-context-scrim" data-close-context></div>
    <aside class="hub-context" data-context role="dialog" aria-modal="false" aria-label="Детали выбранного объекта" tabindex="-1"></aside>
  </div>
  <div class="hub-modal" data-modal hidden></div>
  <div class="hub-toast" data-toast hidden role="status" aria-live="polite"></div>
</body>
</html>
